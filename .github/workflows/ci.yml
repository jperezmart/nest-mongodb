# SCAFFOLDING — a starting point, not canon. Unlike release.yml, nothing is
# bound to this filename: rename it, rewrite it, or delete it entirely.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json # reads devEngines.runtime
          cache: pnpm

      # CI does not publish: no id-token, no registry-url.
      - run: pnpm install --frozen-lockfile

      # mongodb-memory-server's postinstall is declined in pnpm-workspace.yaml, to
      # keep a ~100 MB fetch out of the publishing path that release.yml shares.
      # That decision needs this step to be safe: turbo runs the two test tasks in
      # parallel, so without a binary already on disk both race to download the
      # same one and collide on its lockfile. Here it is fetched once, serially,
      # and only in CI — release.yml stays lean.
      - run: pnpm --filter @jperezmart/nest-mongodb exec node node_modules/mongodb-memory-server/postinstall.js

      # ↓ your checks. Delete the ones you don't have.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

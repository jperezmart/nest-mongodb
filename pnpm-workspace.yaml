packages:
  - 'packages/*'
  - 'apps/*'

# Migrated from the repo's .npmrc, which pnpm 11 no longer reads: `pnpm config
# get auto-install-peers` returned `undefined` after the bump, so all three
# settings below had gone silently inert and autoInstallPeers had reverted to
# its default of `true`. That matters here — packages/core and packages/testing
# keep explicit peer ranges spanning several majors on purpose (see the catalog
# note below), and auto-installing peers undoes exactly that.
autoInstallPeers: false
# Hoist nothing implicitly, to catch missing deps early
strictPeerDependencies: false
# Allow workspace packages to be linked
linkWorkspacePackages: true

# pnpm >= 10 blocks a dependency's build scripts unless it is listed here.
# mongodb-memory-server's postinstall is only a cache warm-up: it pre-downloads
# the mongod binary so the first test run does not pay for it. Declining it is
# safe — the package fetches the binary lazily on first use — and it keeps a
# ~100 MB network fetch out of the publishing pipeline, whose
# `pnpm install --frozen-lockfile` needs no mongod at all.
allowBuilds:
  mongodb-memory-server: false

# Centralized versions (pnpm catalog). Reference with "catalog:" in package.json.
# Peer-dependency ranges in packages/core and packages/testing stay explicit on
# purpose (they intentionally span multiple major versions).
catalog:
  # runtime — nest
  '@nestjs/cli': ^11.0.24
  '@nestjs/common': ^11.2.3
  '@nestjs/core': ^11.2.3
  '@nestjs/platform-express': ^11.2.3
  '@nestjs/testing': ^11.2.3
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  express: ^5.1.0
  # runtime — mongodb
  mongodb: ^7.6.0
  mongodb-memory-server: ^11.2.0
  # build / tooling
  tsdown: ^0.22.14
  turbo: ^2.10.12
  typescript: ^6.0.3
  vitest: ^4.1.11
  supertest: ^7.2.2
  # types (@types/node tracks the Node major → 24 LTS)
  '@types/node': ^24.13.3
  '@types/supertest': ^7.2.0
  # eslint + prettier
  eslint: ^10.9.1
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.69.0
  '@typescript-eslint/parser': ^8.69.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-import: ^2.32.0
  eslint-plugin-simple-import-sort: ^13.0.0
  eslint-plugin-turbo: ^2.10.12
  globals: ^17.12.0
  prettier: ^3.9.6
  prettier-plugin-packagejson: ^3.0.2
  prettier-plugin-sort-json: ^4.2.0

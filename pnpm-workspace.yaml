packages:
  - 'packages/*'
  - 'apps/*'

# Centralized versions (pnpm catalog). Reference with "catalog:" in package.json.
# Peer-dependency ranges in packages/core and packages/testing stay explicit on
# purpose (they intentionally span multiple major versions).
catalog:
  # runtime — nest
  '@nestjs/cli': ^11.0.23
  '@nestjs/common': ^11.1.27
  '@nestjs/core': ^11.1.27
  '@nestjs/platform-express': ^11.1.27
  '@nestjs/testing': ^11.1.27
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  express: ^5.1.0
  # runtime — mongodb
  mongodb: ^7.3.0
  mongodb-memory-server: ^11.2.0
  # build / tooling
  tsdown: ^0.22.3
  turbo: ^2.9.18
  typescript: ^6.0.3
  vitest: ^4.1.9
  supertest: ^7.2.2
  # types (@types/node tracks the Node major → 24 LTS)
  '@types/node': ^24.0.0
  '@types/supertest': ^7.2.0
  # eslint + prettier
  eslint: ^10.3.0
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.59.2
  '@typescript-eslint/parser': ^8.59.2
  eslint-config-prettier: ^10.1.8
  eslint-plugin-import: ^2.32.0
  eslint-plugin-simple-import-sort: ^13.0.0
  eslint-plugin-turbo: ^2.9.12
  globals: ^17.6.0
  prettier: ^3.8.3
  prettier-plugin-packagejson: ^3.0.2
  prettier-plugin-sort-json: ^4.2.0
